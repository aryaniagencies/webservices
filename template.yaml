AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Reusable serverless JavaScript API backed by TiDB.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/http.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/*
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          AWS_S3_BUCKET: !Ref MediaBucket
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
  MediaBucket:
    Type: String
  SesFromEmail:
    Type: String